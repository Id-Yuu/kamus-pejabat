<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus Pejabat - Trending</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Kalam:wght@400;700&family=Patrick+Hand&family=Shantell+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #121418;
            --card-bg: #1e222b;
            --card-border: #363d4e;
            --text-main: #f0ede6;
            --text-muted: #a0a8b6;
            --accent-yellow: #facc15;
            --accent-green: #4ade80;
            --accent-cyan: #38bdf8;
            --accent-orange: #fb923c;
            --border-sketch: 255px 15px 225px 15px/15px 225px 15px 255px;
            --font-hand: 'Patrick Hand', 'Shantell Sans', 'Kalam', cursive;
            --font-sketch: 'Patrick Hand', cursive;
            --font-title: 'Gochi Hand', cursive;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0),
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, var(--bg-color) 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-sketch);
            padding: 1.5rem;
            color: var(--text-main);
            font-size: 1.25rem;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: var(--card-bg);
            border: 3px solid var(--card-border);
            border-radius: var(--border-sketch);
            padding: 2.2rem;
            box-shadow: 8px 10px 0px #000;
            position: relative;
        }

        header {
            margin-bottom: 1.5rem;
            border-bottom: 2px dashed var(--card-border);
            padding-bottom: 1rem;
        }

        h1 {
            font-family: var(--font-title);
            font-size: 2.8rem;
            color: var(--accent-yellow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            text-shadow: 2px 2px 0px #000;
        }

        h1 small {
            font-size: 1.2rem;
            color: var(--accent-cyan);
            border: 2px solid var(--accent-cyan);
            border-radius: var(--border-sketch);
            padding: 0.2rem 0.8rem;
            transform: rotate(-2deg);
        }

        .subhead {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-top: 0.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        textarea {
            width: 100%;
            background: #14171f;
            border: 3px solid var(--card-border);
            border-radius: var(--border-sketch);
            padding: 1.2rem;
            font-size: 1.35rem;
            line-height: 1.6;
            letter-spacing: 0.5px;
            color: var(--accent-yellow);
            resize: vertical;
            min-height: 140px;
            font-family: var(--font-hand);
            outline: none;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.5);
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent-yellow);
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .btn-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .btn {
            background: #2a3140;
            border: 2px solid var(--card-border);
            color: var(--text-main);
            font-family: var(--font-title);
            font-size: 1.3rem;
            padding: 0.5rem 1.4rem;
            border-radius: var(--border-sketch);
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s, background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        .btn-primary {
            background: var(--accent-yellow);
            color: #121418;
            border-color: var(--accent-yellow);
        }

        .btn-primary:hover {
            background: #fde047;
        }

        .btn-swap {
            background: var(--accent-orange);
            color: #121418;
            border-color: var(--accent-orange);
        }

        .btn-swap:hover {
            background: #fdba74;
        }

        .btn-sm {
            font-size: 1rem;
            padding: 0.2rem 0.8rem;
            box-shadow: 2px 2px 0px #000;
        }

        .btn-sm:hover {
            box-shadow: 3px 3px 0px #000;
        }

        .stats-badge {
            background: #14171f;
            border: 2px solid var(--card-border);
            border-radius: var(--border-sketch);
            padding: 0.2rem 0.8rem;
            font-size: 1.1rem;
            color: var(--accent-cyan);
        }

        .output-box {
            background: #14171f;
            border: 3px solid var(--card-border);
            border-radius: var(--border-sketch);
            padding: 1.2rem;
            min-height: 100px;
            margin-bottom: 1.5rem;
            position: relative;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.5);
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--accent-green);
            font-family: var(--font-title);
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px dashed #2a3140;
            padding-bottom: 0.3rem;
        }

        .output-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .output-content {
            font-family: var(--font-hand);
            font-size: 1.45rem;
            color: #fff;
            line-height: 1.6;
            letter-spacing: 0.5px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .output-content:empty::before {
            content: "Hasil terjemahan akan tampil di sini...";
            color: var(--text-muted);
            font-style: italic;
        }

        .accordion {
            border: 2px solid var(--card-border);
            border-radius: var(--border-sketch);
            background: #181c24;
            overflow: hidden;
            margin-top: 1rem;
        }

        .accordion-header {
            width: 100%;
            background: #222733;
            border: none;
            color: var(--accent-yellow);
            font-family: var(--font-title);
            font-size: 1.4rem;
            padding: 0.8rem 1.2rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .accordion-header:hover {
            background: #2a3140;
        }

        .accordion-icon {
            transition: transform 0.3s;
        }

        .accordion-header.active .accordion-icon {
            transform: rotate(180deg);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #14171f;
        }

        .accordion-body {
            padding: 1rem;
            max-height: 280px;
            overflow-y: auto;
        }

        .dict-search {
            width: 100%;
            background: #1e222b;
            border: 2px solid var(--card-border);
            border-radius: var(--border-sketch);
            padding: 0.5rem 0.8rem;
            color: var(--text-main);
            font-family: var(--font-sketch);
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
            outline: none;
        }

        .dict-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.6rem;
        }

        .dict-item {
            background: #1e222b;
            border: 1px solid var(--card-border);
            padding: 0.4rem 0.7rem;
            border-radius: 8px;
            font-size: 1.05rem;
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
            user-select: none;
        }

        .dict-item:hover {
            background: #2a3140;
            border-color: var(--accent-yellow);
            transform: scale(1.02);
        }

        .dict-key {
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .dict-val {
            color: var(--accent-green);
            text-align: right;
        }

        .toast-msg {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent-yellow);
            color: #121418;
            font-family: var(--font-title);
            font-size: 1.2rem;
            padding: 0.6rem 1.2rem;
            border-radius: var(--border-sketch);
            border: 2px solid #000;
            box-shadow: 4px 4px 0px #000;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateY(0);
        }

        footer {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 1rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .container { padding: 1.2rem; }
            h1 { font-size: 2.2rem; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .btn-group { justify-content: space-between; }
            .dict-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>
                🐭 Kamus-Pejabat
                <small id="modeTag">Kamus ➔ ID</small>
            </h1>
            <div class="subhead" id="subheadText">
                ✍️ Mode Normal: Masukkan kamus pejabat untuk diterjemahkan ke Bahasa Indonesia.
            </div>
        </header>

        <main>
            <div class="input-group">
                <textarea id="inputText" placeholder="Contoh: tedy lu, padahal cuma ganjar">tedy lu, padahal cuma ganjar</textarea>
            </div>

            <div class="action-bar">
                <div class="btn-group">
                    <button class="btn btn-primary" id="translateBtn">🔄 Terjemahkan</button>
                    <button class="btn btn-swap" id="swapBtn">🔀 Mode Dibalik</button>
                    <button class="btn" id="clearBtn">✕ Kosongkan</button>
                </div>
                <span class="stats-badge" id="inputWordCount">0 kata</span>
            </div>

            <div class="output-box">
                <div class="output-header">
                    <span id="outputTitle">📄 Hasil Terjemahan (B.Indonesia)</span>
                    <div class="output-actions">
                        <span id="outputWordCount">0 kata</span>
                        <button class="btn btn-sm" id="copyBtn">📋 Salin</button>
                    </div>
                </div>
                <div class="output-content" id="outputContent"></div>
            </div>

            <div class="accordion">
                <button class="accordion-header" id="accordionToggle">
                    <span>📚 Lihat Kamus Kosa-Kata (<span id="dictTotalCount">0</span>)</span>
                    <span class="accordion-icon">▼</span>
                </button>
                <div class="accordion-content" id="accordionContent">
                    <div class="accordion-body">
                        <input type="text" class="dict-search" id="dictSearch" placeholder="Cari kosa kata...">
                        <div class="dict-grid" id="dictGrid"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <span id="modeFooter">Mode: Kamus ➔ Bahasa Indonesia</span>
            <span>* Klik kata di kamus untuk memasukkannya</span>
        </footer>
    </div>

    <div class="toast-msg" id="toast">Teks disalin!</div>

    <script src="js/dictionary.js"></script>
    <script src="js/translator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
