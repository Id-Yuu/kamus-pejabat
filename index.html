<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus Pejabat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        .controls {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            background-color: #fff;
            cursor: pointer;
        }

        .translator-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .translator-box {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #3498db;
        }

        textarea[readonly] {
            background-color: #f8f9fa;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ KamusPejabat</h1>

        <div class="controls">
            <label for="modeSelect">Pilih Mode Terjemahan:</label>
            <select id="modeSelect">
                <option value="slang-to-id">Kamus Pejabat ➔ Bahasa Indonesia</option>
                <option value="id-to-slang">Bahasa Indonesia ➔ Kamus Pejabat</option>
            </select>
        </div>

        <div class="translator-box">
            <div class="input-group">
                <label for="inputText">Teks Asli (Klik kata untuk ganti variasi):</label>
                <textarea id="inputText" placeholder="Ketik kalimat di sini..."></textarea>
            </div>
            <div class="input-group">
                <label for="outputText">Hasil Terjemahan:</label>
                <textarea id="outputText" readonly placeholder="Hasil terjemahan akan muncul di sini..."></textarea>
            </div>
        </div>
    </div>

    <script src="js/dictionary.js"></script>
    <script src="js/translator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
