<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus Pejabat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #22242b; --paper: #fffdf5; --paper-dark: #f2eadb; --blue: #2666cf; --orange: #d96436; --green: #26734d; --line: #d7cdbb; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; padding: 32px 18px; color: var(--ink); font-family: 'Nunito Sans', sans-serif; background-color: #e8e1d3; background-image: radial-gradient(#c8bda9 1px, transparent 1px); background-size: 20px 20px; }
        .container { width: min(100%, 980px); margin: 0 auto; padding: clamp(24px, 5vw, 48px); background: var(--paper); border: 2px solid var(--ink); border-radius: 20px 28px 19px 25px; box-shadow: 8px 9px 0 var(--ink); }
        .eyebrow, .group-kicker { color: var(--orange); font-family: 'Kalam', cursive; font-size: 1rem; font-weight: 700; letter-spacing: .04em; }
        h1, h2, h3, label, .handwritten { font-family: 'Kalam', cursive; }
        h1 { margin: 3px 0 8px; font-size: clamp(2.3rem, 6vw, 4.1rem); line-height: 1; color: var(--blue); }
        .intro { max-width: 620px; margin-bottom: 30px; color: #565b66; font-size: 1rem; line-height: 1.6; }
        .controls { display: grid; gap: 8px; margin-bottom: 24px; }
        label { font-size: 1.25rem; font-weight: 700; }
        select, textarea, button { font: inherit; }
        select { width: 100%; min-height: 52px; padding: 10px 14px; color: var(--ink); font-family: 'Kalam', cursive; font-size: 1.15rem; background: #fff; border: 2px solid var(--ink); border-radius: 12px 16px 11px 14px; cursor: pointer; }
        select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid #f6bd60; outline-offset: 3px; }
        .translator-box { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
        .input-group { display: grid; gap: 8px; }
        .label-hint { font-family: 'Nunito Sans', sans-serif; font-size: .8rem; font-weight: 600; color: #6b7280; }
        textarea { width: 100%; min-height: 190px; padding: 15px; color: var(--ink); font-family: 'Kalam', cursive; font-size: 1.27rem; line-height: 1.45; background: repeating-linear-gradient(var(--paper), var(--paper) 32px, #d9e5f4 33px); border: 2px solid var(--ink); border-radius: 14px 10px 15px 11px; resize: vertical; }
        textarea[readonly] { color: #155e3c; background: repeating-linear-gradient(#f4fbf6, #f4fbf6 32px, #cce6d5 33px); border-style: dashed; }
        ::placeholder { color: #9096a0; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 28px; }
        .button { min-height: 42px; padding: 8px 16px; border: 2px solid var(--ink); border-radius: 12px 15px 11px 14px; font-family: 'Kalam', cursive; font-weight: 700; cursor: pointer; transition: transform .16s ease, box-shadow .16s ease; }
        .button:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
        .button-copy { color: #fff; background: var(--blue); }.button-reset { background: #fff; }.copy-status { min-height: 1.2em; color: var(--green); font-size: .9rem; font-weight: 700; }
        .accordion-item { overflow: hidden; background: #fff; border: 2px solid var(--ink); border-radius: 16px 20px 14px 18px; }
        .accordion-header { display: flex; width: 100%; padding: 15px 18px; color: var(--ink); text-align: left; background: #f8f2e6; border: 0; cursor: pointer; align-items: center; justify-content: space-between; gap: 16px; }
        .accordion-header:hover { background: #f2e6d3; }.accordion-header span:first-child { font-family: 'Kalam', cursive; font-size: 1.3rem; font-weight: 700; }.accordion-icon { color: var(--blue); font-size: 1.1rem; }
        .accordion-content { display: none; padding: 18px; border-top: 2px dashed var(--line); }.accordion-content.open { display: block; }
        .vocabulary-group { padding: 16px; background: #fffdf8; border: 1px solid var(--line); border-left: 6px solid var(--orange); border-radius: 10px; }
        .vocabulary-group-heading { display: flex; justify-content: space-between; gap: 16px; align-items: start; margin-bottom: 14px; }.vocabulary-group h3 { font-size: 1.55rem; line-height: 1.1; }.vocabulary-group-heading p:not(.group-kicker) { margin-top: 3px; color: #626872; font-size: .9rem; }.word-count { flex: none; padding: 3px 10px; color: var(--blue); font-size: .8rem; font-weight: 800; background: #e9f0ff; border-radius: 999px; }
        .badge-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 9px; }.dict-badge { min-width: 0; padding: 9px 11px; text-align: left; color: var(--ink); background: #fff; border: 1px solid #bfb29c; border-radius: 9px 12px 8px 11px; cursor: pointer; transition: background .16s ease, transform .16s ease; }.dict-badge:hover { background: #fff0df; border-color: var(--orange); transform: translateY(-2px); }.dict-badge strong { display: block; color: var(--blue); font-family: 'Kalam', cursive; font-size: 1.08rem; line-height: 1.1; }.dict-badge span { display: block; margin-top: 2px; color: #676c76; font-size: .78rem; line-height: 1.25; }
        @media (max-width: 650px) { body { padding: 20px 12px; }.container { box-shadow: 5px 6px 0 var(--ink); }.translator-box { grid-template-columns: 1fr; }.vocabulary-group-heading { display: block; }.word-count { display: inline-block; margin-top: 8px; }.badge-list { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); } }
    </style>
</head>
<body>
    <main class="container">
        <p class="eyebrow">Penerjemah kata viral</p>
        <h1>⚡ Kamus Pejabat</h1>
        <p class="intro">Pilih arah terjemahan, tulis kata, lalu gunakan daftar kosakata sesuai kategori untuk mengisi teks dengan cepat.</p>
        <div class="controls">
            <label for="modeSelect">Arah terjemahan</label>
            <select id="modeSelect">
                <option value="slang-to-id">Kamus Pejabat → Bahasa Indonesia</option>
                <option value="id-to-slang">Bahasa Indonesia → Kamus Pejabat</option>
            </select>
        </div>
        <section class="translator-box" aria-label="Penerjemah">
            <div class="input-group">
                <label for="inputText">Teks asli <span class="label-hint">Klik kata di teks untuk mengganti variasi, bila tersedia.</span></label>
                <textarea id="inputText" placeholder="Ketik atau pilih kosakata di bawah..."></textarea>
            </div>
            <div class="input-group">
                <label for="outputText">Hasil terjemahan</label>
                <textarea id="outputText" readonly placeholder="Hasil terjemahan muncul di sini..."></textarea>
            </div>
        </section>
        <div class="actions">
            <button class="button button-copy" type="button" id="copyButton">Salin output</button>
            <button class="button button-reset" type="button" id="resetButton">Reset</button>
            <span class="copy-status" id="copyStatus" role="status" aria-live="polite"></span>
        </div>
        <section class="accordion-item">
            <button class="accordion-header" id="accordionBtn" type="button" aria-expanded="false" aria-controls="accordionContent">
                <span id="accordionTitle">Daftar Kosakata</span><span class="accordion-icon" id="accordionIcon" aria-hidden="true">▼</span>
            </button>
            <div class="accordion-content" id="accordionContent"></div>
        </section>
    </main>
    <script src="js/dictionary.js"></script>
    <script src="js/translator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
